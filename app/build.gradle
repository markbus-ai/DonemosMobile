plugins {
    id 'com.android.application'
}

android {
    namespace 'com.donemosmobile'
    compileSdk 34

    defaultConfig {
        applicationId "com.donemosmobile"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            // Backend local del emulador de Android.
            buildConfigField "String", "API_BASE_URL", "\"http://10.0.2.2:8000/\""
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // TODO: reemplazar por la URL real de producción cuando esté disponible.
            buildConfigField "String", "API_BASE_URL", "\"https://api.donemos.example/\""
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        // Known findings live in the baseline; anything new fails the build.
        // Refresh it deliberately with ./gradlew :app:updateLintBaseline.
        baseline file("lint-baseline.xml")
        warningsAsErrors true
        abortOnError true
        // Upgrade hints change whenever a new release ships upstream: keep them
        // visible in the report without failing a build nobody changed.
        informational 'GradleDependency', 'OldTargetApi', 'AndroidGradlePluginVersion'
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    testImplementation 'junit:junit:4.13.2'
}
